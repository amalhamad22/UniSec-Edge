[honeypot]
hostname = SOHO-Router
listen_endpoints = tcp:2222:interface=0.0.0.0

[ssh]
enabled = true
version = SSH-2.0-OpenSSH_8.4p1 Debian-5
auth_class = UserDB

[output_jsonlog]
enabled = true
logfile = var/log/cowrie/cowrie.json

[output_textlog]
enabled = true
logfile = var/log/cowrie/cowrie.log
