%YAML 1.1
---
af-packet:
  - interface: eth0
    cluster-id: 99
    cluster-type: cluster_flow
    defrag: yes

outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: /var/log/suricata/eve.json
      types:
        - alert
        - anomaly

  - fast:
      enabled: yes
      filename: /var/log/suricata/fast.log
      append: yes

default-rule-path: /etc/suricata
rule-files:
  - custom.rules

app-layer:
  protocols:
    tls:
      enabled: yes
    http:
      enabled: yes
    ssh:
      enabled: yes
    ftp:
      enabled: yes
    dns:
      enabled: yes
